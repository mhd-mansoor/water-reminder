# Tests and builds Water Reminder for Windows, macOS and Linux.
#
# - Every push / pull request: runs the test suite on all three systems, builds the
#   apps, and starts each built app once (smoke test). The apps are kept as
#   downloadable "artifacts" on the Actions run.
# - Pushing a version tag (e.g. `git tag v1.4.0 && git push origin v1.4.0`) also
#   publishes them on the Releases page. Installed copies then update themselves.
name: Build apps

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Test & build (${{ matrix.label }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows
          - os: macos-latest        # Apple Silicon (M1 and newer)
            label: macOS
          - os: ubuntu-22.04        # older glibc = runs on more Linux versions
            label: Linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Linux libraries Qt needs
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb-cursor0 libxkbcommon-x11-0 libxcb-icccm4 libxcb-keysyms1 \
            libxcb-shape0 libxcb-render-util0 libxcb-image0 libegl1 libxss1 libgl1

      - name: Install tools
        run: python -m pip install --upgrade pip "PySide6-Essentials>=6.8" "pyinstaller>=6.10" pillow pyflakes pytest

      - name: Lint
        run: python -m pyflakes water_reminder.py packaging/build.py tests

      - name: Tests
        run: python -m pytest -q tests
        env:
          QT_QPA_PLATFORM: offscreen

      - name: Build (includes a smoke test of the built app)
        run: python packaging/build.py

      - uses: actions/upload-artifact@v4
        with:
          name: WaterReminder-${{ matrix.label }}
          path: dist/release/*
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      # water_reminder.py lets Python-based installs update themselves;
      # SHA256SUMS.txt lets installers and the app verify every download.
      - name: Add update files and checksums
        run: |
          grep -q "APP_VERSION = \"${GITHUB_REF_NAME#v}\"" water_reminder.py || {
            echo "::error::Tag ${GITHUB_REF_NAME} doesn't match APP_VERSION in water_reminder.py"; exit 1; }
          cp water_reminder.py release/
          cd release && sha256sum * > ../SHA256SUMS.txt && mv ../SHA256SUMS.txt .
          cat SHA256SUMS.txt

      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
          body: |
            ## Install or update with one command

            **Windows** (PowerShell):
            ```powershell
            irm https://raw.githubusercontent.com/${{ github.repository }}/main/install.ps1 | iex
            ```
            **macOS / Linux** (Terminal):
            ```bash
            curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/main/install.sh | bash
            ```
            Already installed? The app offers this update by itself, or run the same command again.

            ## Or download a file
            | System | File |
            |---|---|
            | Windows 10/11 | **WaterReminder-Windows.zip** — extract, then open `WaterReminder.exe` |
            | macOS 12+ (Apple Silicon) | **WaterReminder-macOS.dmg** |
            | Linux (x86-64) | **WaterReminder-Linux-x86_64** |
